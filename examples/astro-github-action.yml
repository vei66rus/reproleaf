name: Reproleaf Astro GEO & SEO Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: vei66rus/reproleaf/integrations/github-action@main
        with:
          dir: dist
          preset: landing
          format: sarif
          output: reproleaf-results.sarif
          comment-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reproleaf-results.sarif
          category: reproleaf-seo-geo
