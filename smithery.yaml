startCommand:
  type: stdio
  configSchema:
    type: object
    required: [serverPath]
    properties:
      serverPath:
        type: string
        description: Absolute path to src/mcp.mjs in the unpacked Reproleaf kit. Install its dependencies locally before starting.
        minLength: 1
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: [config.serverPath]
    })
exampleConfig:
  serverPath: /absolute/path/to/reproleaf/src/mcp.mjs
