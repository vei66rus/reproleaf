<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reproleaf SEO & GEO Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="rl-ext">
    <header class="rl-ext-head">
      <div class="rl-ext-brand">
        <span class="rl-ext-dot"></span>
        <strong>Reproleaf</strong>
        <code id="badge-text">activeTab only</code>
      </div>
      <button type="button" id="lang-btn" class="rl-ext-badge rl-ext-lang">EN</button>
    </header>
    <p id="note-text" class="rl-ext-note">Чтение открытой вкладки только по клику. Нулевая сетевая телеметрия.</p>
    <div class="rl-ext-actions">
      <button type="button" id="inspect-btn" class="rl-ext-primary">Проверить вкладку</button>
      <button type="button" id="extract-btn" class="rl-ext-secondary">SERP / Конкурент JSON</button>
    </div>
    <div class="rl-ext-actions rl-ext-handoff">
      <button type="button" id="copy-packet-btn" class="rl-ext-secondary" disabled>Пакет Reproleaf</button>
      <button type="button" id="copy-prompt-btn" class="rl-ext-secondary" disabled>Промпт для Cursor / Claude</button>
      <button type="button" id="open-web-btn" class="rl-ext-secondary" disabled>Открыть на evolkov.tech</button>
    </div>
    <p id="status" class="rl-ext-status" role="status" aria-live="polite"></p>
    <section id="results" class="rl-ext-results" hidden>
      <div id="metrics" class="rl-ext-metrics"></div>
      <pre id="extract-preview" class="rl-ext-preview" hidden></pre>
      <ul id="findings" class="rl-ext-findings"></ul>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
